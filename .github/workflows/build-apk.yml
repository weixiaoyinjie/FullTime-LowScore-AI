name: Build FullTime LowScore AI APK v1.1 - SDK fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FullTimeLowScoreAI_v1_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu 24.04 runners already include Android SDK 35 and Build Tools 35.
      # Do not run android-actions/setup-android@v3: it tries to download
      # different cmdline tools and may fail before the APK build starts.
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          ls -lh "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          ls -lh "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          echo 'Android SDK 35 and build-tools 35.0.0 are ready.'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack source zip
        shell: bash
        run: |
          set -euo pipefail
          test -s FullTimeLowScoreAI_v1_OneUpload.zip
          mkdir -p unpacked
          unzip -oq FullTimeLowScoreAI_v1_OneUpload.zip -d unpacked
          test -f unpacked/settings.gradle
          test -f unpacked/app/src/main/AndroidManifest.xml

      - name: Verify score model
        working-directory: unpacked
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          javac -encoding UTF-8 -d out app/src/main/java/com/lowcore/fulltime/ScoreModel.java tests/ScoreModelSelfTest.java
          java -cp out ScoreModelSelfTest

      - name: Compile debug APK
        working-directory: unpacked
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -s unpacked/app/build/outputs/apk/debug/app-debug.apk
          ls -lh unpacked/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FullTimeLowScoreAI-v1.1-debug-apk
          path: unpacked/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
