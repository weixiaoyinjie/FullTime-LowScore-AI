name: Build FullTime LowScore AI APK v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FullTimeLowScoreAI_v1_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35 and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack source zip
        run: |
          test -s FullTimeLowScoreAI_v1_OneUpload.zip
          mkdir -p unpacked
          unzip -oq FullTimeLowScoreAI_v1_OneUpload.zip -d unpacked
          test -f unpacked/settings.gradle
          test -f unpacked/app/src/main/AndroidManifest.xml

      - name: Verify score model
        working-directory: unpacked
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out app/src/main/java/com/lowcore/fulltime/ScoreModel.java tests/ScoreModelSelfTest.java
          java -cp out ScoreModelSelfTest

      - name: Compile debug APK
        working-directory: unpacked
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          test -s unpacked/app/build/outputs/apk/debug/app-debug.apk
          ls -lh unpacked/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FullTimeLowScoreAI-v1-debug-apk
          path: unpacked/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
